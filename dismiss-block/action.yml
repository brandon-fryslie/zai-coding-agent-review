name: "CoPirate Dismiss Block"
description: "Gitea-only companion to CoPirate Code Review: dismisses this action's own round-cap-blocked review with a separate, Admin-level credential Gitea's dismiss-review endpoint requires. No-op when nothing is outstanding."
inputs:
  GITHUB_TOKEN:
    description: "Token for reading the PR and its reviews."
    required: false
    default: ${{ github.token }}
  GITHUB_REVIEW_TOKEN:
    description: "The review step's own bot identity (e.g. secrets.COPIRATE_REVIEW_TOKEN). Used to verify that a round-cap notice on the PR was actually posted by this identity before trusting it to release anything, and to post a failure notice if the dismissal below is refused. Pass the same value given to the review step."
    required: false
  DISMISS_TOKEN:
    description: "Required. Credential for a repo-Admin account, used ONLY for the dismiss-review call. GITHUB_REVIEW_TOKEN's write access 403s this call on Gitea (measured live against Gitea 1.27.1); no token scope substitutes for the collaborator role."
    required: true
  PR_NUMBER:
    description: "Pull request number. Auto-detected on pull_request events; pass explicitly on others (e.g. workflow_run)."
    required: false
  HEAD_SHA:
    description: "Head commit SHA any posted failure notice anchors to. Auto-detected on pull_request events."
    required: false
  ZAI_REVIEWER_NAME:
    description: "Name shown in any posted failure-notice header. Pass the same value given to the review step so both voices match."
    required: false
runs:
  using: "node24"
  main: "dist/index.js"
branding:
  icon: "unlock"
  color: "gray-dark"
