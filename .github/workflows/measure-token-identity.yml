# TEMPORARY MEASUREMENT INSTRUMENT — zai-review-trust-6yp, delete once the record is taken.
#
# The ticket's blocking question is empirical: summarizePriorReviews needs the action's OWN reviewer
# identity to gate a forged marker, and every candidate discriminator is measured-wrong or unverified.
# `author_association` is useless (github-actions[bot] reports NONE, identical to an outside
# contributor) and `user.type === 'Bot'` breaks the documented user-PAT GITHUB_REVIEW_TOKEN path.
# What is left is asking the token who it is — and that answer cannot be obtained anywhere but inside
# a real Actions job, because the default GITHUB_TOKEN is an installation token no local `gh` holds.
#
# Two probes, taken together on purpose. If exactly one succeeds per token kind, the pair is a TOTAL
# discriminator (installation vs PAT) rather than a guess about one endpoint's undocumented behavior:
#   GET /user                      — resolves a PAT's login; expected to refuse an installation token
#   GET /installation/repositories — only an installation token can call it; expected to refuse a PAT
# The PAT side of both is already measured locally (/user -> {login, type:"User"}), so this job takes
# the installation side.
#
# curl, not gh: octokit sends exactly this request, and gh's exit codes and error prose would stand
# between the measurement and the wire. Status and body are recorded verbatim — a non-2xx IS a result
# here, so the probe records it and moves on; only curl failing to complete a request fails the job.
name: Measure token identity

on:
  push:
    branches: [zai-review-trust-6yp]

permissions:
  contents: read
  pull-requests: write # the review job's own permission set, so the token measured is the token used

jobs:
  measure:
    name: Probe GITHUB_TOKEN identity
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          probe() {
            echo "=== GET $1 ==="
            curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}$1"
            echo
          }
          probe /user
          probe /installation/repositories
          # The territory the gate would compare against: how a review THIS action posted is authored
          # when read back through the same token. jq trims the multi-KB bodies to the identity fields.
          echo "=== reviews on PR #121, identity fields only ==="
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/121/reviews?per_page=100" \
            | jq -c '.[] | {id, login: .user.login, uid: .user.id, type: .user.type, assoc: .author_association}'
